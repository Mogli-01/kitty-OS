[alias]
# `cargo xtask <cmd>` runs the host-side build tool (see xtask/).
xtask = "run --quiet --package xtask --"

[target.x86_64-unknown-none]
# relocation-model=pie (Phase 8c, D-068): the kernel is a relocatable PIE so
# Limine can load it at a random base (KASLR). Its only dynamic relocations
# are R_X86_64_RELATIVE, applied by Limine before it jumps to us.
# code-model=kernel: the kernel stays in the top 2 GiB wherever it lands
# (Limine slides it within that range), as this code model requires.
rustflags = ["-C", "relocation-model=pie", "-C", "code-model=kernel"]
