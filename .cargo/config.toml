[alias]
# `cargo xtask <cmd>` runs the host-side build tool (see xtask/).
xtask = "run --quiet --package xtask --"

[target.x86_64-unknown-none]
# The kernel is an ELF PIE so Limine can relocate the higher-half image.
# Keep the target's default kernel code model to match its prebuilt core.
rustflags = ["-C", "relocation-model=pic"]
