# `per-package-target` lets `cargo build`/`cargo clippy` at the workspace root
# always build the kernel for bare metal while xtask builds for the host.
cargo-features = ["per-package-target"]

[package]
name = "kitty-kernel"
version.workspace = true
edition.workspace = true
repository.workspace = true
forced-target = "x86_64-unknown-none"

[[bin]]
name = "kitty-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Only for automated tests: lets the kernel power off QEMU through the
# isa-debug-exit device. Never enabled in normal builds.
qemu-exit = []
# Boot self-tests that deliberately crash the kernel, to check the exception
# reports. Only for automated tests (expect QEMU exit code 35).
selftest-page-fault = []
selftest-double-fault = []
selftest-stack-overflow = []
selftest-write-text = []
selftest-exec-data = []
selftest-write-idt = []
selftest-heap-overflow = []
# Fires a real hardware interrupt (PIT IRQ0 through the 8259 PIC) and
# checks it reaches its handler. Does not panic: expect exit code 33.
selftest-irq-pit = []
# Opt in to the boot-CPU xAPIC controller while validating the handover.
xapic = ["dep:kitty-acpi", "dep:kitty-apic"]
selftest-xapic = ["xapic", "selftest-irq-pit"]
selftest-xapic-no-madt = ["xapic", "selftest-irq-pit"]
selftest-lapic-timer = ["selftest-xapic"]
lapic-scheduler-timer = ["xapic"]
selftest-lapic-scheduler = ["lapic-scheduler-timer"]

# Two busy threads that never yield must both make progress (PIT ticks call
# sched::tick). Does not panic: expect exit code 33.
selftest-preempt = []
# A kernel thread recurses into its stack guard page: expect a double fault.
selftest-thread-stack-overflow = []

# Exercises the actual boot PIT driver under QEMU's normal test exit path.
selftest-pit-driver = []
# The kernel reads a user page directly: with SMAP, expect a #PF report.
selftest-smap = []
# The kernel executes a user page: with SMEP, expect a #PF report.
selftest-smep = []
# Prints decoded events to the serial console for the automated QEMU test.
selftest-ps2-input = []
selftest-ps2-keyboard = ["selftest-ps2-input"]
# Checks the known file and directory in the xtask initrd fixture.
selftest-initrd = []
selftest-pci-enumeration = []

[dependencies]
limine = "0.6.5"
kitty-hal = { path = "../hal" }
kitty-acpi = { path = "../drivers/acpi", optional = true }
kitty-apic = { path = "../drivers/apic", optional = true }

kitty-pci = { path = "../drivers/pci" }
kitty-pit = { path = "../drivers/pit" }
kitty-ps2 = { path = "../drivers/ps2" }
kitty-vfs = { path = "../fs/vfs" }
