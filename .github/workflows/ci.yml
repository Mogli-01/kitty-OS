# Initial CI created by Claude in the bootstrap PR. From now on this file is
# owned by Codex (see AGENTS.md); Claude asks for changes via "para-codex".
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  drivers:
    name: Driver tests (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo test --locked -p kitty-ps2
      - run: cargo miri test --locked -p kitty-ps2
      - run: cargo build --locked --release -p kitty-ps2 --target x86_64-unknown-none

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned by commit SHA (supply-chain safety). v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo clippy -p kitty-kernel --locked --all-features -- -D warnings
      - run: cargo clippy --workspace --locked --release -- -D warnings
      - name: Build release without test features
        run: cargo build --workspace --locked --release

  i8042:
    name: i8042 transport (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo test --locked -p kitty-i8042
      - run: cargo miri test --locked -p kitty-i8042
      - run: cargo build --locked --release -p kitty-i8042 --target x86_64-unknown-none

  boot:
    name: QEMU (${{ matrix.firmware }}, ${{ matrix.profile }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install QEMU, OVMF and xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check CPU exceptions and PS/2 keyboard events
        shell: bash
        env:
          FIRMWARE: ${{ matrix.firmware }}
          PROFILE: ${{ matrix.profile }}
        run: |
          flags=()
          if [[ "$FIRMWARE" == bios ]]; then flags+=(--bios); fi
          if [[ "$PROFILE" == release ]]; then flags+=(--release); fi
          mkdir -p build/serial-logs

          run_case() {
            local scenario=$1 status=0
            shift
            # xtask always writes to the same path. Keep any log from this run.
            rm -f build/serial-test.log
            cargo xtask test "${flags[@]}" "$@" || status=$?
            if [[ -f build/serial-test.log ]]; then
              mv build/serial-test.log "build/serial-logs/$scenario.log"
            fi
            return "$status"
          }

          run_case boot
          grep -F -- '[cpu] breakpoint at rip=' build/serial-logs/boot.log
          grep -F -- '[cpu] breakpoint exception handled, execution resumed' build/serial-logs/boot.log

          run_case page-fault --features selftest-page-fault --expect-panic
          grep -F -- '=== Page Fault (#PF) (vector 14)' build/serial-logs/page-fault.log
          grep -F -- 'non-present page on read in kernel mode' build/serial-logs/page-fault.log

          run_case double-fault --features selftest-double-fault --expect-panic
          grep -F -- '=== Double Fault (#DF) (vector 8)' build/serial-logs/double-fault.log
          grep -F -- '(running on the IST double-fault stack)' build/serial-logs/double-fault.log

          controller='[irq] interrupts enabled (controller: 8259 PIC)'
          cargo xtask test-keyboard "${flags[@]}" --expect "$controller"
          cargo xtask test-mouse "${flags[@]}" --expect "$controller"
      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serial-logs-${{ matrix.firmware }}-${{ matrix.profile }}
          path: |
            build/serial-logs/*.log
            build/serial-keyboard.log
            build/serial-mouse.log
          if-no-files-found: ignore
