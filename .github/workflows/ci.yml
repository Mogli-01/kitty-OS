# Initial CI created by Claude in the bootstrap PR. From now on this file is
# owned by Codex (see AGENTS.md); Claude asks for changes via "para-codex".
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  drivers:
    name: Driver tests (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo test --locked -p kitty-ps2
      - run: cargo miri test --locked -p kitty-ps2
      - run: cargo build --locked --release -p kitty-ps2 --target x86_64-unknown-none

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned by commit SHA (supply-chain safety). v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo clippy -p kitty-kernel --locked --all-features -- -D warnings
      - run: cargo clippy --workspace --locked --release -- -D warnings
      - name: Build release without test features
        run: cargo build --workspace --locked --release

  uart:
    name: UART driver (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo clippy -p kitty-uart --locked --all-targets -- -D warnings
      - run: cargo test -p kitty-uart --locked
      - run: cargo miri test -p kitty-uart --locked
      - run: cargo build -p kitty-uart --target x86_64-unknown-none --release --locked

  apic:
    name: APIC driver (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo clippy -p kitty-apic --locked --all-targets -- -D warnings
      - run: cargo test -p kitty-apic --locked
      - run: cargo miri test -p kitty-apic --locked

  pit:
    name: PIT driver (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo clippy -p kitty-pit --locked --all-targets -- -D warnings
      - run: cargo test -p kitty-pit --locked
      - run: cargo miri test -p kitty-pit --locked

  i8042:
    name: i8042 transport (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo test --locked -p kitty-i8042
      - run: cargo miri test --locked -p kitty-i8042
      - run: cargo build --locked --release -p kitty-i8042 --target x86_64-unknown-none

  pci:
    name: PCI decoder (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo clippy -p kitty-pci --locked --all-targets -- -D warnings
      - run: cargo test -p kitty-pci --locked
      - run: cargo miri test -p kitty-pci --locked
      - run: cargo build -p kitty-pci --target x86_64-unknown-none --release --locked

  graphics:
    name: User-space graphics (host and Miri)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri
      - run: cargo clippy -p kitty-gfx --locked --all-targets -- -D warnings
      - run: cargo test -p kitty-gfx --locked
      - run: cargo miri test -p kitty-gfx --locked
      - run: cargo fmt --manifest-path fuzz/graphics/Cargo.toml --all --check
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fetch --manifest-path fuzz/graphics/Cargo.toml --locked
      - name: Fuzz PSF2 parsing and drawing under AddressSanitizer
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run --fuzz-dir fuzz/graphics psf2 -- -max_total_time=15 -timeout=5 -max_len=65536
      - run: git diff --exit-code -- fuzz/graphics/Cargo.lock

  boot:
    name: QEMU (${{ matrix.firmware }}, ${{ matrix.profile }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install QEMU, OVMF and xorriso
        run: bash .github/scripts/install-qemu.sh
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check boot, faults, scheduling, framebuffer, PS/2 input and initrd
        shell: bash
        env:
          FIRMWARE: ${{ matrix.firmware }}
          PROFILE: ${{ matrix.profile }}
        run: |
          flags=()
          if [[ "$FIRMWARE" == bios ]]; then flags+=(--bios); fi
          if [[ "$PROFILE" == release ]]; then flags+=(--release); fi
          mkdir -p build/serial-logs

          run_case() {
            local scenario=$1 status=0
            shift
            # xtask always writes to the same path. Keep any log from this run.
            rm -f build/serial-test.log
            cargo xtask test "${flags[@]}" "$@" || status=$?
            if [[ -f build/serial-test.log ]]; then
              mv build/serial-test.log "build/serial-logs/$scenario.log"
            fi
            return "$status"
          }

          run_case boot \
            --expect '[sched] cooperative self-test passed' \
            --expect '[sched] wait queue self-test passed'
          grep -F -- '[cpu] breakpoint at rip=' build/serial-logs/boot.log
          grep -F -- '[cpu] breakpoint exception handled, execution resumed' build/serial-logs/boot.log

          run_case xapic-pit --features selftest-xapic \
            --expect 'controller: I/O APIC + xAPIC' \
            --expect '[apic] two IRQ0 deliveries acknowledged' \
            --expect 'hardware IRQ0 (PIT) delivered twice'

          run_case lapic-timer --features selftest-lapic-timer \
            --expect 'controller: I/O APIC + xAPIC' \
            --expect '[apic] two local timer deliveries acknowledged'

          run_case lapic-scheduler --features selftest-lapic-scheduler \
            --expect 'controller: I/O APIC + xAPIC' \
            --expect '[lapic] scheduler timer ready' \
            --expect '[lapic] driver preempted a busy thread twice' \
            --expect '[sched] cooperative self-test passed'

          run_case xapic-no-madt --features selftest-xapic-no-madt \
            --expect '[apic-test] simulating an unavailable MADT' \
            --expect 'controller: 8259 PIC' \
            --expect 'hardware IRQ0 (PIT) delivered twice'

          no_acpi_machine=q35
          missing_table='NoMadt|NoRsdp'
          if [[ "$FIRMWARE" == bios ]]; then
            # SeaBIOS on the pc machine boots without an RSDP when ACPI is off.
            no_acpi_machine=pc
            missing_table=NoRsdp
          fi
          no_acpi_qemu="$RUNNER_TEMP/kitty-qemu-no-acpi"
          cat > "$no_acpi_qemu" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          while (($#)); do
            if [[ "$1" == -machine ]]; then
              args+=(-machine "$KITTY_NO_ACPI_MACHINE,acpi=off")
              shift 2
            else
              args+=("$1")
              shift
            fi
          done
          exec qemu-system-x86_64 "${args[@]}"
          EOF
          chmod +x "$no_acpi_qemu"
          KITTY_QEMU="$no_acpi_qemu" KITTY_NO_ACPI_MACHINE="$no_acpi_machine" \
            run_case xapic-firmware-no-madt --features selftest-xapic \
              --expect 'controller: 8259 PIC' \
              --expect 'hardware IRQ0 (PIT) delivered twice'
          grep -E -- "\\[acpi\\] no usable MADT \\(($missing_table)\\)" \
            build/serial-logs/xapic-firmware-no-madt.log

          KITTY_QEMU="$no_acpi_qemu" KITTY_NO_ACPI_MACHINE="$no_acpi_machine" \
            run_case lapic-scheduler-fallback --features lapic-scheduler-timer,selftest-pit-driver \
              --expect 'controller: 8259 PIC' \
              --expect '[pit] driver preempted a busy thread twice' \
              --expect '[sched] cooperative self-test passed'

          run_case page-fault --features selftest-page-fault --expect-panic
          grep -F -- '=== Page Fault (#PF) (vector 14)' build/serial-logs/page-fault.log
          grep -F -- 'non-present page on read in kernel mode' build/serial-logs/page-fault.log

          run_case double-fault --features selftest-double-fault --expect-panic
          grep -F -- '=== Double Fault (#DF) (vector 8)' build/serial-logs/double-fault.log
          grep -F -- '(running on the IST double-fault stack)' build/serial-logs/double-fault.log

          run_case preemption --features selftest-preempt \
            --expect '[sched] preemption self-test passed' \
            --expect 'idle + wake from IRQ work'

          run_case thread-stack-guard --features selftest-thread-stack-overflow --expect-panic \
            --expect '[sched] wait queue self-test passed' \
            --expect '=== Double Fault (#DF) (vector 8)' \
            --expect '(running on the IST double-fault stack)'

          run_case pit-irq --features selftest-irq-pit --expect 'hardware IRQ0 (PIT) delivered twice'
          run_case pit-scheduler --features selftest-pit-driver \
            --expect '[pit] driver preempted a busy thread twice' \
            --expect '[sched] cooperative self-test passed'
          cargo xtask test-visual "${flags[@]}"
          controller='[irq] interrupts enabled (controller: 8259 PIC)'
          cargo xtask test-keyboard "${flags[@]}" --expect "$controller"
          cargo xtask test-mouse "${flags[@]}" --expect "$controller"
          cargo xtask test-initrd "${flags[@]}"
      - name: Upload serial logs and framebuffer capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serial-logs-${{ matrix.firmware }}-${{ matrix.profile }}
          path: |
            build/serial-logs/*.log
            build/visual/
            build/serial-keyboard.log
            build/serial-mouse.log
            build/initrd-tests/*/*.log
          if-no-files-found: ignore
